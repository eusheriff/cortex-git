# Staging/migration target for Xerifegomes@hotmail.com's Cloudflare account.
# The Artifact baseline and D1 snapshot were copied from Gmail; this config
# deploys the isolated Hotmail Worker without attaching any custom domains.
name = "cortex-git"
account_id = "6938b9775448fabcdd8f0c07283f87c1"
main = "src/index.ts"
compatibility_date = "2026-10-02"
compatibility_flags = ["nodejs_compat"]

[[artifacts]]
binding = "ARTIFACTS"
namespace = "cortex-git"

[vars]
ENVIRONMENT = "production"
PLATFORM_NAME = "CORTEX Git"
SECURITY_LEVEL = "FAIL_CLOSED"
JURISDICTION = "eu"
CLOUDFLARE_ACCOUNT_ID = "6938b9775448fabcdd8f0c07283f87c1"

[[d1_databases]]
binding = "DB"
database_name = "cortex-git-governance"
database_id = "abc2ff6c-59c7-49ca-804f-df12ba3b1438"
migrations_dir = "migrations"

[[workflows]]
binding = "GOVERNANCE_WORKFLOW"
name = "cortex-git-governance"
class_name = "GovernanceWorkflow"

[[triggers.events]]
type = "cf.artifacts.repo.pushed"
targets = [{ type = "workflow", workflow_name = "cortex-git-governance" }]

[triggers.events.filter]
namespace = "cortex-git"

[[kv_namespaces]]
binding = "CORTEX_KV"
id = "b4eb7e7ce3744ef485b83dd615c7b9c5"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

  [observability.logs]
  enabled = true
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  head_sampling_rate = 1
