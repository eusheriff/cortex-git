name = "cortex-git"
main = "src/index.ts"
compatibility_date = "2026-10-02"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Artifacts Git binding (Open Beta)
# Connects the Worker directly to programmable Git repositories
# In Workers code: env.ARTIFACTS
[[artifacts]]
binding = "ARTIFACTS"
namespace = "cortex-git"

[vars]
ENVIRONMENT = "production"
PLATFORM_NAME = "CORTEX Git"
SECURITY_LEVEL = "FAIL_CLOSED"
JURISDICTION = "eu"
CLOUDFLARE_ACCOUNT_ID = "e71984852bedaf5f21cef5d949948498"

# Persistent governance, approval, conflict, and promotion state.
[[d1_databases]]
binding = "DB"
database_name = "cortex-git-governance"
database_id = "21131839-1aa4-4a70-98ad-ccc32115a2e9"
migrations_dir = "migrations"

[[workflows]]
binding = "GOVERNANCE_WORKFLOW"
name = "cortex-git-governance"
class_name = "GovernanceWorkflow"

[[triggers.events]]
type = "cf.artifacts.repo.pushed"
targets = [{ type = "workflow", workflow_name = "cortex-git-governance" }]

[triggers.events.filter]
namespace = "cortex-git"

# Fast global revocation and emergency kill-switch (<2ms read, 250ms replication)
[[kv_namespaces]]
binding = "CORTEX_KV"
id = "08d005fcfbdf41d383c96d0545364330"

[triggers]
crons = ["*/5 * * * *"]

# Native Cloudflare Observability & Cloudflare Traces (W3C OpenTelemetry)
[observability]
enabled = true
head_sampling_rate = 1

  [observability.logs]
  enabled = true
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  head_sampling_rate = 1

