name = "cortex-git"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Artifacts Git binding (Open Beta)
# Connects the Worker directly to programmable Git repositories
# In Workers code: env.ARTIFACTS
[[artifacts]]
binding = "ARTIFACTS"
namespace = "cortex-git"

[vars]
ENVIRONMENT = "production"
PLATFORM_NAME = "CORTEX Git"
SECURITY_LEVEL = "FAIL_CLOSED"
JURISDICTION = "eu"

# D1 Database for Forensic WORM Merkle Ledger & Agent Sessions
[[d1_databases]]
binding = "DB"
database_name = "cortex-git-ledger"
database_id = "cortex-git-ledger-d1"

# Event subscription to Artifacts push and lifecycle events
[[queues.consumers]]
queue = "artifacts-events-queue"
max_batch_size = 10
max_batch_timeout = 5
